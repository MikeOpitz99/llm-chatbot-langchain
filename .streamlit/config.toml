[theme]
# Matrix neon green
primaryColor = "#00FF41"
# Black void BG
backgroundColor = "#000000"
# Dark matrix code BG
secondaryBackgroundColor = "#001100"
# Glowing text
textColor = "#00FF00"
# MONO font (terminal code style)
font = "monospace"

# Wide layout for immersion
[server]
maxUploadSize = 200
enableXsrfProtection = false
enableCORS = false
